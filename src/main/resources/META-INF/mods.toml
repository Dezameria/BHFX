modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: body parts follow playerAnimator's elbow / knee / torso bends (Emotecraft, Iron's Spells cast poses).
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
