plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mods pulled in with fg.deobf (Carpet) ship SRG refmaps; remap them to dev names or their mixins fail
            // ("Critical injection failure ... m_91320_") and the client never starts.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Carpet: NeoForged 1.0.8 (Forge 1.20.1)
    implementation fg.deobf("maven.modrinth:XqqOkvZz:XMYeNIOx")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// plain JUnit on pure logic (params, command parsing); nothing here boots Minecraft
tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// BHSpells consumes bhfx from mavenLocal: ./gradlew publishToMavenLocal
// then in BHSpells: compileOnly fg.deobf("net.deizyn:bhfx:${mod_version}")
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            artifact jar
            artifact sourcesJar
        }
    }
}

// publish the reobfuscated jar, as in BHSpells/libs (reobfJar rewrites the jar in place)
tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// gradlew checkShaders (also part of check/build): compile-check every pass shader with glslangValidator
ext.glslShaderRoots = { -> [file('src/main/resources')] }
ext.glslIncludeRoots = { -> [file('src/main/resources')] }
apply from: 'gradle/glsl-check.gradle'

// BHSpells builds against bhfx from its libs/ folder (flatDir), so friends who clone it can build without this repo.
// After every build, replace the bhfx jar there with this one (reobfuscated, not -sources). BHSpells also lists
// mavenLocal, and Gradle prefers a repository with a pom over flatDir, so a stale ~/.m2 copy of the same version would
// win (docs/bugs.md, 2026-11-04): publish there too.
def bhspellsLibs = file('../BHSpells/libs')
tasks.register('copyToBHSpells', Copy) {
    group = 'distribution'
    description = 'Copies the built bhfx jar into ../BHSpells/libs and mavenLocal, replacing older bhfx jars.'
    dependsOn 'reobfJar', 'publishToMavenLocal'
    onlyIf { bhspellsLibs.isDirectory() }
    doFirst {
        project.delete(fileTree(bhspellsLibs) { include "${mod_id}-*.jar" })
    }
    from(tasks.named('jar').flatMap { it.archiveFile })
    into bhspellsLibs
    // ForgeGradle keeps its first fg.deobf copy of a version, so a rebuilt jar with the same version would never
    // reach BHSpells' runClient (docs/bugs.md, 2026-11-04). Drop that copy; a running client may still hold it.
    doLast {
        def deobf = new File(gradle.gradleUserHomeDir,
                "caches/forge_gradle/deobf_dependencies/${mod_group_id.replace('.', '/')}/${mod_id}")
        def stale = deobf.listFiles({ File f -> f.isDirectory() && f.name.startsWith("${mod_version}_") } as FileFilter)
        stale?.each { File dir ->
            try {
                project.delete(dir)
            } catch (Exception ignored) {
            }
            if (dir.exists()) {
                logger.warn("bhfx: could not clear ${dir}; close BHSpells' client and delete it, or runClient keeps the old jar")
            } else {
                logger.lifecycle("bhfx: cleared ForgeGradle's deobf copy ${dir.name}")
            }
        }
    }
}
tasks.named('build') {
    finalizedBy 'copyToBHSpells'
}
