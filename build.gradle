plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }
    }
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// BHSpells consumes bhfx from mavenLocal: ./gradlew publishToMavenLocal
// then in BHSpells: compileOnly fg.deobf("net.deizyn:bhfx:${mod_version}")
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            artifact jar
            artifact sourcesJar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// gradlew checkShaders (also part of check/build): compile-check every pass shader with glslangValidator
ext.glslShaderRoots = { -> [file('src/main/resources')] }
ext.glslIncludeRoots = { -> [file('src/main/resources')] }
apply from: 'gradle/glsl-check.gradle'

// BHSpells builds against bhfx from its libs/ folder (flatDir, checked before mavenLocal), so friends who clone it can
// build without this repo. After every build, replace the bhfx jar there with this one (reobfuscated, not -sources).
def bhspellsLibs = file('../BHSpells/libs')
tasks.register('copyToBHSpells', Copy) {
    group = 'distribution'
    description = 'Copies the built bhfx jar into ../BHSpells/libs, replacing older bhfx jars.'
    dependsOn 'reobfJar'
    onlyIf { bhspellsLibs.isDirectory() }
    doFirst {
        project.delete(fileTree(bhspellsLibs) { include "${mod_id}-*.jar" })
    }
    from(tasks.named('jar').flatMap { it.archiveFile })
    into bhspellsLibs
}
tasks.named('build') {
    finalizedBy 'copyToBHSpells'
}
